name: filerelay

services:
  filerelay:
    container_name: file-relay
    build: .
    image: file-relay:local
    volumes:
      - relay-data:/app/data
    restart: unless-stopped
    ports:
      - "12345:12345"
    environment:
      APP_ENV: "${APP_ENV:-production}"
      LOG_LEVEL: warning
      ACCESS_LOG: "false"
      WORKERS: "1"
      FILERELAY_DATA_ROOT: /app/data
      FORWARDED_ALLOW_IPS: "${FORWARDED_ALLOW_IPS:-}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  relay-data:
